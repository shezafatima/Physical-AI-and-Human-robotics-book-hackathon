openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for the RAG-powered chatbot integration between frontend and backend
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server
paths:
  /v1/chat:
    post:
      summary: Process user query and return RAG-generated response
      description: Handles user queries and returns responses generated by the RAG agent based on book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuery'
      responses:
        '200':
          description: Successful response from the RAG agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UserQuery:
      type: object
      required:
        - message
        - context_mode
      properties:
        message:
          type: string
          description: The user's question
          example: "What are the key principles of physical AI?"
          minLength: 10
          maxLength: 1000
        selected_text:
          type: string
          description: Text selected by user for context
          example: "Embodied cognition is the theory that cognitive processes are deeply rooted in the body's interactions with the world."
          minLength: 10
          maxLength: 5000
        context_mode:
          type: string
          description: How to process the query
          enum: [full_content, selected_text]
          example: "full_content"
        session_id:
          type: string
          description: Session identifier for maintaining conversation context
          example: "sess-abc123"
    BackendResponse:
      type: object
      required:
        - response
        - status
        - timestamp
      properties:
        response:
          type: string
          description: The AI-generated answer to the user's query
          example: "The key principles of physical AI include embodied cognition, sensorimotor learning, and adaptive control systems..."
          minLength: 10
          maxLength: 10000
        sources:
          type: array
          description: Citations to source documents used in the response
          items:
            type: string
          example: ["Chapter 3: Embodied Cognition", "Chapter 5: Sensorimotor Learning"]
        confidence:
          type: string
          description: Confidence level of the response
          enum: [high, medium, low, insufficient_data]
          example: "high"
        error:
          type: string
          description: Error message if processing failed
          example: "Processing error occurred"
        status:
          type: string
          description: Processing status
          enum: [success, error, timeout]
          example: "success"
        context:
          $ref: '#/components/schemas/ResponseContext'
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of response generation
          example: "2025-12-18T10:30:00Z"
    ResponseContext:
      type: object
      properties:
        retrieved_docs_count:
          type: integer
          description: Number of documents retrieved for context
          example: 3
        source_docs:
          type: array
          description: List of source documents used
          items:
            type: string
          example: ["doc1", "doc2", "doc3"]
        confidence_scores:
          type: array
          description: Confidence scores for retrieved documents
          items:
            type: number
            format: float
          example: [0.8, 0.7, 0.6]
    ErrorResponse:
      type: object
      required:
        - error
        - status
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request format"
        status:
          type: string
          description: Error status
          enum: [error, timeout]
          example: "error"